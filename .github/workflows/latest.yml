name: "latest"

on:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Linter 🧹
        id: linter
        run: make lint

  deploy:
    runs-on: ubuntu-24.04
    needs: [lint]
    permissions:
      id-token: write
      contents: write
    env:
      BUILD_DIR: build
      S3_KEY: bmlt-portal
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Build package 🔧
        run: PROD=1 make build

      - name: Configure AWS credentials 🪪
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions/gh-ci-s3-artifact
          role-session-name: gh-actions-bmlt-portal
          aws-region: us-east-1

      - name: Copy artifact to S3 🪣
        run: |
          aws s3 cp ${BUILD_DIR}/bmlt-portal.zip \
            s3://${{ secrets.S3_BUCKET }}/${S3_KEY}/bmlt-portal-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA}
