name: "release"

on:
  push:
    tags: ["*"]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Linter 🧹
        id: linter
        run: make lint

  package:
    runs-on: ubuntu-24.04
    needs: [lint]
    permissions:
      contents: write
    env:
      BUILD_DIR: build
    steps:
      - name: Check out code 🛒
        uses: actions/checkout@v7

      - name: Setup PHP 🐫
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Build package 🔧
        run: PROD=1 make build

      - name: Generate release notes 📝
        run: |
          curl -sLO https://raw.githubusercontent.com/bmlt-enabled/release-notes-tool/master/gh-release-notes.sh
          chmod +x gh-release-notes.sh
          ./gh-release-notes.sh CHANGELOG.md "##"

      - name: Create Release 🎉
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.BUILD_DIR }}/bmlt-portal.zip"
          bodyFile: "changelog.txt"
          prerelease: ${{ contains(github.ref, 'beta') }}
